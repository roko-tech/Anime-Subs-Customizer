name: Release

# Builds the Windows installer + portable ZIP, tests them, attests them and
# creates a DRAFT release. See docs/releasing.md.
#   - push of an annotated tag vX.Y.Z  -> full release flow (draft at the end)
#   - workflow_dispatch                -> rehearsal; with ref=vX.Y.Z also (re)creates the draft
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build (a vX.Y.Z tag also creates the draft)"
        required: true
        default: master

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  REF: ${{ github.event.inputs.ref || github.ref }}

jobs:
  ffmpeg:
    # A minimal LGPL-only FFmpeg built from source (ADR-004): no external
    # libraries except zlib, so its only notices are FFmpeg's and zlib's.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - name: Build FFmpeg (cross-compiled for Windows x64) and stage its source
        env:
          WORK_DIR: ${{ runner.temp }}/ffmpeg-build
          SOURCE_OUT: ${{ github.workspace }}/ffmpeg-out
          ASC_REF: ${{ env.REF }}
        run: bash packaging/ffmpeg/build-ffmpeg.sh "$SOURCE_OUT/bin"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg
          path: ffmpeg-out
          if-no-files-found: error

  build:
    needs: ffmpeg
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.12"

      - name: Version must match the tag
        id: version
        shell: pwsh
        run: |
          $v = (Select-String anime_subs/runtime.py -Pattern '^APP_VERSION = "(\d+\.\d+\.\d+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          $ref = "${{ env.REF }}" -replace '^refs/tags/', ''
          if ($ref -match '^v\d+\.\d+\.\d+$') {
            if ($ref -ne "v$v") { throw "tag $ref does not match APP_VERSION $v" }
            "tag=$ref" >> $env:GITHUB_OUTPUT
          }
          "Building $v (ref $ref)"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg
          path: ffmpeg

      # Inno Setup's own installer runs "ISIDE.exe /assoc" for its default
      # fileassoc task and waits for it; on the runner the IDE never exits
      # (the job's cleanup killed an orphan Compil32), so the step hung.
      # Skip that task, bound every wait and keep Setup's log.
      - name: Install Inno Setup 7.1.0 (pinned)
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ProgressPreference = "SilentlyContinue"
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe"
          Invoke-WebRequest $url -OutFile innosetup.exe -TimeoutSec 120
          $hash = (Get-FileHash innosetup.exe -Algorithm SHA256).Hash
          if ($hash -ne "0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F") { throw "Inno Setup hash mismatch: $hash" }
          "Downloaded Inno Setup 7.1.0 (hash OK)"
          $log = Join-Path $PWD "innosetup-install.log"
          $p = Start-Process innosetup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/MERGETASKS=`"!fileassoc`"", "/LOG=`"$log`"" -PassThru
          $done = $p.WaitForExit(180000)
          if (-not $done -or $p.ExitCode -ne 0 -or -not (Test-Path "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe")) {
            Get-Content $log -ErrorAction SilentlyContinue
            throw "Inno Setup install failed (finished: $done, exit code: $($p.ExitCode))"
          }
          "Inno Setup installed"

      - name: Build (tests, freeze, self-test, notices, installer, portable ZIP)
        shell: pwsh
        run: pwsh scripts/build.ps1 -Python python -FFmpegDir ffmpeg/bin

      - name: Installer smoke test (install, self-test, upgrade a running copy, uninstall)
        shell: pwsh
        run: pwsh scripts/installer-smoke.ps1 -Setup build/out/AnimeSubsCustomizer-Setup.exe -Evidence build/smoke

      - name: SBOM, FFmpeg source note, checksums
        shell: pwsh
        run: |
          .venv-build\Scripts\python.exe -m cyclonedx_py environment .venv-build --output-format JSON --output-file build/out/sbom.cdx.json
          Copy-Item ffmpeg/FFMPEG-SOURCE.md, ffmpeg/*-source.tar.gz build/out/
          Push-Location build/out
          Get-ChildItem -File | Where-Object Name -ne "SHA256SUMS.txt" | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
          Pop-Location

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: build/out
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-evidence
          path: |
            build/smoke
            build/selftest-frozen.json

  attest:
    # Build-provenance attestations are free only on public repositories.
    needs: build
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            assets/AnimeSubsCustomizer-Setup.exe
            assets/AnimeSubsCustomizer-portable.zip
            assets/SHA256SUMS.txt
            assets/sbom.cdx.json
            assets/THIRD-PARTY-NOTICES.txt
            assets/FFMPEG-SOURCE.md
            assets/*-source.tar.gz

  draft:
    needs: [build, attest]
    if: >-
      always() && needs.build.result == 'success' && needs.build.outputs.tag != '' &&
      (needs.attest.result == 'success' || needs.attest.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets
      - name: Create the draft release (never touches a published one)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          notes="docs/release-notes/${TAG}.md"
          test -f "$notes" || { echo "missing $notes"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "$TAG is already published; leaving it alone"; exit 0
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" assets/* --draft --verify-tag --title "Anime Subs Customizer ${TAG#v}" \
              --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
          fi
